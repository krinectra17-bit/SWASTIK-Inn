<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Swastika Inn — Comfortable Hotel Stay in Ayodhya</title>
    <meta name="description" content="Swastika Inn, officially Swastika Hotel & Lawn, offers comfortable AC rooms in Deokaali, Ayodhya. Book via WhatsApp. Near Shri Ram Janmabhoomi and Hanuman Garhi. ₹1,080 onwards." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://swastikainn.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swastikainn.com/" />
    <meta property="og:title" content="Swastika Inn — Comfortable Hotel in Ayodhya" />
    <meta property="og:description" content="Book comfortable AC rooms at Swastika Inn, Deokaali, Ayodhya. Free Wi-Fi, parking, and 24-hour front desk. Easy WhatsApp booking." />
    <meta property="og:image" content="https://swastikainn.com/images/exterior-evening.jpg" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Swastika Inn" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swastika Inn — Comfortable Hotel in Ayodhya" />
    <meta name="twitter:description" content="Book comfortable AC rooms at Swastika Inn, Deokaali, Ayodhya." />
    <meta name="twitter:image" content="https://swastikainn.com/images/exterior-evening.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts — preconnect first for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload hero image -->
    <link rel="preload" as="image" href="/images/exterior-evening.jpg" />

    <!-- Structured Data — Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "Swastika Inn",
      "alternateName": "Swastika Hotel & Lawn",
      "description": "Comfortable hotel offering air-conditioned rooms in Deokaali, Ayodhya, Uttar Pradesh. Convenient access to Shri Ram Janmabhoomi and other Ayodhya landmarks.",
      "url": "https://swastikainn.com",
      "telephone": "+916393556011",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Mohabra Road, Near Bhavdiya Public School, Deokaali",
        "addressLocality": "Ayodhya",
        "addressRegion": "Uttar Pradesh",
        "postalCode": "224123",
        "addressCountry": "IN"
      },
      "checkinTime": "12:00",
      "checkoutTime": "11:00",
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Air conditioning", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Free Wi-Fi", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Free parking", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "24-hour front desk", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Room service", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Power backup", "value": true }
      ],
      "petsAllowed": true,
      "image": [
        "https://swastikainn.com/images/exterior-evening.jpg",
        "https://swastikainn.com/images/exterior-night.jpg",
        "https://swastikainn.com/images/room-double.jpg",
        "https://swastikainn.com/images/room-triple.jpg"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
